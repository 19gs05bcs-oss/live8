name: Update Itaevents

on:
  schedule:
    - cron: "0 7,10,12,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-files:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz beautifulsoup4

      - name: Clean existing JSON
        run: |
          rm -f daddyliveSchedule.json

      - name: Fetch schedule
        run: |
          python extract_schedule.py

      - name: Generate M3U8 Playlist
        run: |
          python live.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "__pycache__/" >> .gitignore
          echo "*.pyc" >> .gitignore
          
          git add .
          if [[ -n $(git status --porcelain) ]]; then
            git commit -m "Update Itaevents $(date +%Y-%m-%d\ %H:%M)"
            git push
          else
            echo "No changes to commit"
          fi
